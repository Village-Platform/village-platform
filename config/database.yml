default: &default
  adapter: postgresql
  encoding: unicode
  # Every process (Puma, and each Solid Queue process it forks) builds its own pool from this, so it
  # fits the hungrier one: Puma's threads, or a worker's job threads + its polling and heartbeat
  # threads. Pools open connections lazily, so the spare slots in Puma cost nothing.
  max_connections: <%= [ ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("JOB_THREADS", 2).to_i + 2 ].max %>
  host: <%= ENV["DB_HOST"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  port: <%= ENV["DB_PORT"] %>

development:
  <<: *default
  database: aghour_services_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
test:
  <<: *default
  database: aghour_services_test

# In production set DATABASE_URL, e.g. postgres://user:pass@host/aghour_services_production
# (on Vercel the Neon integration sets it). The URL may point to a transaction pooler,
# so prepared statements are off. Migrations use DATABASE_URL_UNPOOLED (bin/docker-entrypoint).
production:
  <<: *default
  database: aghour_services_production
  prepared_statements: false
