test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# File bodies in PostgreSQL. For hosts without a persistent disk (Vercel).
database:
  service: Database

# Cloudflare R2 (S3-compatible, no egress fees). Media that must not live in PostgreSQL (video)
# goes here when MEDIA_STORAGE_SERVICE=r2; set ACTIVE_STORAGE_SERVICE=r2 to move everything.
# R2_ENDPOINT is https://<account id>.r2.cloudflarestorage.com.
r2:
  service: S3
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  # Newer aws-sdk-s3 versions send CRC checksums R2 rejects on presigned uploads.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
