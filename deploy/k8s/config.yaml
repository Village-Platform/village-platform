# Non-secret settings. Secrets (SECRET_KEY_BASE, CRON_SECRET, POSTGRES_PASSWORD, SUPER_ADMIN_PASSWORD)
# live in the "village-env" Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: village-config
data:
  RAILS_ENV: production
  RAILS_MAX_THREADS: "3"
  RAILS_LOG_LEVEL: info
  CORS_ORIGINS: "*"
  SUPER_ADMIN_PHONE: "01000000000"
  INSTAPAY_ADDRESS: yourname@instapay
  VODAFONE_CASH_NUMBER: 010XXXXXXXX
  # Files go to PostgreSQL (stored_files) so the web pod stays stateless.
  ACTIVE_STORAGE_SERVICE: database
  # Cloudflare terminates TLS for aghour.dorfsys.com. ASSUME_SSL makes Rails treat every request as
  # HTTPS (also the CronJob's in-cluster http://web call), so FORCE_SSL adds HSTS and secure cookies
  # without redirecting.
  ASSUME_SSL: "1"
  FORCE_SSL: "1"
  # Telemetry to the collector in deploy/observability. Off until that stack is installed (it needs
  # the 4 GB node): uncomment the endpoint then. Without it the app sends nothing.
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  OTEL_SERVICE_NAME: aghour-api
  OTEL_METRIC_EXPORT_INTERVAL: "30000"
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
