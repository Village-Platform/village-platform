# Postgres metrics (pg_up, connections, database size, transactions, cache hits, locks).
# Its own Deployment rather than a sidecar: adding a container to the StatefulSet would restart Postgres.
# Logs in as a read-only "metrics" role (pg_monitor), not the app's user — see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: DATA_SOURCE_NAME
          ports:
            - { name: metrics, containerPort: 9187 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - { name: metrics, port: 9187, targetPort: metrics }
