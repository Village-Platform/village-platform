# Loki, monolithic, filesystem storage, 7 days of logs. The collector pushes the web pods' logs over
# OTLP; trace_id arrives as structured metadata, which Grafana links to Tempo.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
spec:
  repo: https://grafana-community.github.io/helm-charts
  chart: loki
  version: 18.17.1
  targetNamespace: observability
  valuesContent: |-
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 168h
        allow_structured_metadata: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        size: 5Gi
        storageClass: local-path
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 300Mi }
    # The chart defaults assume a cluster: simple-scalable targets, memcached caches (GBs of memory),
    # a gateway, a canary.
    read: { replicas: 0 }
    write: { replicas: 0 }
    backend: { replicas: 0 }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
    gateway: { enabled: false }
    lokiCanary: { enabled: false }
    test: { enabled: false }
