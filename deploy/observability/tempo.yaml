# Tempo (single binary, local disk): traces from the collector, 72h retention.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: tempo
spec:
  repo: https://grafana-community.github.io/helm-charts
  chart: tempo
  version: 3.2.0
  targetNamespace: observability
  valuesContent: |-
    tempo:
      reportingEnabled: false
      retention: 72h
      # Default receivers kept (the chart's Service template requires the Jaeger ones); only OTLP
      # HTTP :4318 is used, by the collector.
      resources:
        requests: { cpu: 50m, memory: 100Mi }
        limits: { memory: 300Mi }
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
