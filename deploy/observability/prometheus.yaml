# Prometheus server + node-exporter + kube-state-metrics, installed by k3s' helm-controller.
# Every default scrape job is replaced by an explicit, low-cardinality list: the whole stack must
# stay under ~10k series on a small node.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.36.2
  targetNamespace: observability
  valuesContent: |-
    alertmanager:
      enabled: false # alerts are Grafana-managed (grafana-alerting/)
    prometheus-pushgateway:
      enabled: false

    server:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
        evaluation_interval: 30s
      retention: 15d
      retentionSize: 4GB
      persistentVolume:
        size: 5Gi
        storageClass: local-path
      resources:
        requests: { cpu: 100m, memory: 200Mi }
        limits: { memory: 400Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 48Mi }

    kube-state-metrics:
      collectors: [ pods, deployments, statefulsets, daemonsets, cronjobs, jobs, nodes, persistentvolumeclaims ]
      metricAllowlist:
        - kube_pod_container_status_restarts_total
        - kube_pod_container_status_waiting_reason
        - kube_pod_container_status_last_terminated_reason
        - kube_pod_status_phase
        - kube_deployment_status_replicas_available
        - kube_deployment_spec_replicas
        - kube_statefulset_status_replicas_ready
        - kube_daemonset_status_number_ready
        - kube_cronjob_status_last_successful_time
        - kube_job_status_failed
        - kube_node_status_condition
        - kube_persistentvolumeclaim_status_phase
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }

    scrapeConfigs:
      kubernetes-api-servers: { enabled: false }
      kubernetes-nodes: { enabled: false }
      kubernetes-service-endpoints: { enabled: false }
      kubernetes-service-endpoints-slow: { enabled: false }
      prometheus-pushgateway: { enabled: false }
      kubernetes-services: { enabled: false }
      kubernetes-pods: { enabled: false }
      kubernetes-pods-slow: { enabled: false }

      # Container CPU/memory/network from the kubelet; cAdvisor exposes thousands of series, keep five.
      kubernetes-nodes-cadvisor:
        metric_relabel_configs:
          - source_labels: [ __name__ ]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total)
            action: keep

      # The app's metrics, converted by the collector. honor_labels keeps job/instance from the
      # OTel resource (service.name / service.instance.id).
      otel-collector:
        honor_labels: true
        static_configs:
          - targets: [ otel-collector.observability.svc:8889 ]
      otel-collector-self:
        static_configs:
          - targets: [ otel-collector.observability.svc:8888 ]

      postgres-exporter:
        static_configs:
          - targets: [ postgres-exporter.observability.svc:9187 ]

      kube-state-metrics:
        static_configs:
          - targets: [ prometheus-kube-state-metrics.observability.svc:8080 ]

      node-exporter:
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces: { names: [ observability ] }
        relabel_configs:
          - source_labels: [ __meta_kubernetes_service_label_app_kubernetes_io_name ]
            regex: prometheus-node-exporter
            action: keep
          - source_labels: [ __meta_kubernetes_endpointslice_endpoint_node_name ]
            target_label: node

      # Traefik (bundled with k3s) serves Prometheus metrics on its "metrics" entrypoint, :9100.
      traefik:
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [ kube-system ] }
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_label_app_kubernetes_io_name ]
            regex: traefik
            action: keep
          - source_labels: [ __meta_kubernetes_pod_ip ]
            regex: (.+)
            replacement: $1:9100
            target_label: __address__
